apiVersion: v1
kind: Service
metadata:
  name: db-shard-a-primary
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db-shard-a
    statefulset.kubernetes.io/pod-name: db-shard-a-0
---
apiVersion: v1
kind: Service
metadata:
  name: db-shard-a-nodes
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app: db-shard-a
---

apiVersion: v1
kind: Service
metadata:
  name: db-shard-b-primary
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db-shard-b
    statefulset.kubernetes.io/pod-name: db-shard-b-0
---
apiVersion: v1
kind: Service
metadata:
  name: db-shard-b-nodes
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app: db-shard-b
---

apiVersion: v1
kind: Service
metadata:
  name: db-coordinator-service
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db-coordinator