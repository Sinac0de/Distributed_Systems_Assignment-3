apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-shard-databases
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [db-shard-a, db-shard-b]}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress from pods with label "tier: compute" and from the other shard database pods
    - from:
        - podSelector:
            matchLabels:
              tier: compute
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [db-shard-a, db-shard-b]}
      ports:
        - protocol: TCP
          port: 5432